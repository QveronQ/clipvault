[package]
name = "clipvault-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "clipvault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clipvault-core = { path = "../clipvault-core" }
eframe = "0.36.1"
image = "0.25.10"
serde = "1.0.229"
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["json"] }

# macOS : régler la politique d'activation (popup sans icône Dock, mais qui
# prend quand même le focus clavier). Même version de winit qu'eframe 0.36.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
