# Configuration clipvault — à copier dans ~/.config/clipvault/config.toml
# Toutes les clés sont optionnelles (valeurs par défaut ci-dessous).

# Taille max d'un élément capturé, en octets (défaut : 10 Mo)
max_item_bytes = 10485760

# Rétention des entrées non épinglées, en jours
retention_days = 90

# Nombre max d'entrées non épinglées conservées
max_entries = 10000

# Ignorer les copies marquées confidentielles (x-kde-passwordManagerHint)
ignore_password_hint = true

# Répertoire de données (défaut : ~/.local/share/clipvault)
# data_dir = "/chemin/perso"

# Synchronisation avec un serveur clipvault (section absente = pas de sync).
# [sync]
# server = "http://merlin.ts.qdev.ovh:7700"
# token = "le-meme-jeton-que-le-serveur"

# Suivi souris/clavier Logitech Easy-Switch (nécessite la sync active).
# Quand le clavier arrive sur cette machine, la souris suit automatiquement.
# mouse_host = numéro Easy-Switch (1-3) de CETTE machine sur la souris.
# Diagnostic : `clipvault-daemon --logi-probe` liste les périphériques vus.
# [logitech]
# mouse_host = 1
# keyboard = "MX Keys"   # optionnel, sinon détection par type
# mouse = "MX Master"    # optionnel, sinon détection par type
